# Node.js 前端：安装依赖（缓存 node_modules）、检查、构建并上传 dist。
name: node-web
source:
  url: https://git.example.com/team/web.git
  branch: main
stages:
  - name: build
    jobs:
      - name: build
        image: node:20
        cache: {key: "npm-${FLOW_PIPELINE}", paths: [node_modules]}
        artifacts: [dist]
        steps:
          - {name: install, run: npm ci}
          - {name: lint, run: npm run lint --if-present}
          - {name: test, run: npm test --if-present}
          - {name: build, run: npm run build}
